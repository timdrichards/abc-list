name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Serve from https://<user>.github.io/<repo>/, so assets need the repo prefix.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # Supabase renamed the browser-safe key; fall back to an older secret
          # named VITE_SUPABASE_ANON_KEY if that is what is already set.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FAMILY_EMAIL: ${{ secrets.VITE_FAMILY_EMAIL }}
        run: npm run build

      - name: Fail early if the secrets were not set
        run: |
          if grep -rq "your-project-ref.supabase.co" dist/assets 2>/dev/null; then
            echo "::error::Build used placeholder Supabase settings. Add the three repository secrets and re-run."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
